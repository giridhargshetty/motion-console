# Phase 1 prototype settings. Thresholds live here, not in code (CLAUDE.md §7).
# Distances are in screen-heights (1.0 = full height of the camera picture), times in seconds.

[camera]
# "droidcam_usb": straight from the DroidCam phone app over USB (adb), no DroidCam PC client.
#   Keep the PC client closed: the phone app serves one connection at a time.
# "msmf" | "dshow" | "any": a webcam (or the DroidCam PC client's virtual webcam) at `index`;
#   list them with: .venv\Scripts\python bench\bench_pose.py --list
backend = "droidcam_usb"
index = 1
usb_port = 4747      # PC-side port forwarded to the phone (droidcam_usb)
adb = "auto"         # path to adb.exe, or "auto" to find it (DroidCam install, Android SDK, winget)
width = 640
height = 480
rotate = "auto"      # "auto" finds which way up the phone is; or 0 | 90 | 180 | 270 (R key in game)
crop_bars = true     # cut off DroidCam's black letterbox bars
mirror = true        # screen acts like a mirror

[pose]
model = "full"       # lite | full (Phase 0: full = 15 ms/frame on this PC)
max_players = 2      # 1 or 2. With 2, two people in view at the start play against each other
                     # (BLUE on the left, ORANGE on the right). Two people need the phone in landscape.
min_visibility = 0.5 # keypoints less visible than this are ignored

[smoothing]          # One Euro filter on hand positions (see pose_service/filters.py)
min_cutoff = 1.0     # lower = steadier when still, but more lag
beta = 10.0          # higher = less lag on fast swipes

[calibrate]
center_tolerance = 0.12  # how far the hips may be from the middle (fraction of picture width)
min_torso = 0.10         # torso (shoulders to hips) shorter than this = too far away
max_torso = 0.38         # longer than this = too close
need_knees = true        # knees must be visible (makes sure kids stand far enough back)
hold_seconds = 1.5       # stand still in position this long
lost_seconds = 4.0       # nobody seen this long outside a game = calibrate again

[slice]
speed = 3.5          # hand speed needed to cut, in torso-lengths per second, so it scales with
                     # body size: a child's swipe counts like an adult's. Lower = easier
hit_margin = 0.04    # extra reach around each fruit
trail_seconds = 0.22 # how long the blade trail stays on screen
combo_seconds = 0.4  # cuts this close together build a combo (3+ = bonus points)

[menu]
hover_seconds = 1.2  # hold a hand on a mode (or a setup button) this long to pick it
settings_hover_seconds = 2.5  # the WI-FI / SETTINGS strip above head height: longer, so kids don't open it

[network]
backend = "auto"         # "auto" = NetworkManager (nmcli) when present, i.e. the Linux kiosk; off elsewhere.
                         # "fake" = simulated networks, to try the Wi-Fi screens on the laptop
show_at_startup = true   # network screen first; it goes on to the game by itself when online
auto_start_seconds = 10

[game]
window_width = 1280     # windowed size (full screen uses the screen size; the console sets the TV to 720p)
window_height = 720
play_aspect = 0.75     # play area width / height. The phone picture is 0.5625 (9:16); wider shows a
                       # band of it with the top/bottom trimmed. 0 = exactly the camera's shape
crop_top_share = 0.4   # of the trimmed part, how much comes off the top (rest off the bottom)
max_play_aspect = 1.33 # landscape camera (two players): show at most 4:3, trimming the far edges a
                       # little, so the side panels with the two scores still fit
fullscreen = false   # F toggles in game
hands_up_seconds = 1.0
pause_after_seconds = 1.0  # pause only when a player has been out of view this long (tracking
                           # briefly loses people now and then, more often with two)
countdown_seconds = 3
fruit_radius = 0.065
gravity = 1.6
launch_speed = [1.4, 1.8]  # upward speed; 1.8 with gravity 1.6 just reaches the top
fruit_speed = 0.9    # 1.0 = normal; 0.9 = fruit and bombs fly 10% slower on the same arcs

[classic]            # fruit only, against the clock
round_seconds = 60
spawn_every = 1.3
fruits_per_wave = [1, 3]

[survival]           # fruit and bombs, gets harder; each sliced bomb costs a life
spawn_every_start = 1.4
spawn_every_min = 0.6
ramp_seconds = 90    # time to reach full difficulty
fruits_per_wave = [1, 4]
bomb_chance_start = 0.15
bomb_chance_max = 0.35
lives = 5            # bombs you can slice before the game ends (each player, in 2-player)
safe_seconds = 1.0   # after a bomb hit, no further hits for this long (one swipe = one life)

[boxing]             # first-person boxing against a computer boxer (1 player)
hits_to_win = 15     # punches you must land (the boxer's health bar)
hits_to_lose = 15    # punches you can take (your health bar)
punch_speed = 3.0    # hand speed for a punch, torso-lengths per second (like slicing). Lower = easier
punch_forward_speed = 2.5  # or: hand moving TOWARD the camera this fast (MediaPipe depth; noisy)
punch_cooldown = 0.35      # seconds between punches with the same hand
punch_extension = 0.75     # the arm must straighten to this (1.0 = fully straight) for a punch to count;
                           # raising your gloves to block keeps the arms bent, so it doesn't hit
hit_immunity = 0.6   # after landing a punch, the boxer can't be hit again for this long (no flurries)
dodge_lean = 0.5     # head moved this many torso-lengths sideways since the wind-up = dodged
dodge_duck = 0.4     # ...or this far down
result_seconds = 2.0 # on the result screen before hands-up returns to the boxer select
crowd_volume = 0.35  # the crowd murmur under the fight, 0..1 (cheers and punches are separate)

[dressup]            # Dress Up: a magic mirror with costumes that follow you (art: tools/blender/render_costume.py)
costumes = ["knight", "superhero", "astronaut", "pirate", "royal", "wizard"]  # picker order
person_mask = true   # cut the player out of the room (pose model's outline, a few ms); false = camera window
scene = true         # each costume's backdrop behind the player
min_visibility = 0.5 # a piece hides when the body points it hangs on are seen less than this
smooth_min_cutoff = 1.5  # One Euro smoothing of the keypoints: lower = steadier but laggier
smooth_beta = 8.0        # higher = keeps up with fast moves
sparkle_speed = 2.5  # swinging a wand / sword faster than this (torso-lengths per second) sparkles
photo_countdown = 3  # "strike a pose": seconds of 3-2-1
photo_freeze = 2.5   # ...then the picture holds still this long

# The boxers to choose from. windup = seconds of warning before a punch (longer = easier);
# guard_chance = how often they cover up (your punches are blocked); attack_every = seconds between attacks.
[[boxing.boxers]]
name = "ROOKIE"
sprite = "rookie"            # assets/boxers/<sprite>/; until rendered it borrows another boxer's
windup = 1.1
guard_chance = 0.15
attack_every = [2.6, 4.0]

[[boxing.boxers]]
name = "CONTENDER"
sprite = "contender"
windup = 0.85
guard_chance = 0.3
attack_every = [1.9, 3.0]

[[boxing.boxers]]
name = "CHAMP"
sprite = "champ"
windup = 0.65
guard_chance = 0.45
attack_every = [1.3, 2.3]
